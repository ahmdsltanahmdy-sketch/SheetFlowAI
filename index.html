<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SheetFlowAI Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 20px;
        }
        h2 { text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; }
        input, textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            color: var(--tg-theme-text-color, #000000);
        }
        button {
            width: 100%;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        #message { margin-top: 15px; text-align: center; font-size: 14px; }
    </style>
</head>
<body>

    <h2>ثبت اطلاعات در SheetFlowAI</h2>
    
    <div class="form-group">
        <label>عنوان:</label>
        <input type="text" id="title" placeholder="موضوع را وارد کنید...">
    </div>
    
    <div class="form-group">
        <label>توضیحات:</label>
        <textarea id="description" rows="4" placeholder="جزئیات را بنویسید..."></textarea>
    </div>
    
    <button onclick="sendData()">ارسال به گوگل شیت</button>
    
    <div id="message"></div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // لینک اسکریپت گوگل شما
        const API_URL = "https://script.google.com/macros/s/AKfycbzbgW4mK1TiLPjneZlB0vg70Sy4gfrwibNZ7sMeQy0M_sP1dmCrSmETp7fjkbj7RZI4/exec";

        function sendData() {
            let title = document.getElementById('title').value;
            let description = document.getElementById('description').value;
            let msgDiv = document.getElementById('message');

            if (!title || !description) {
                msgDiv.style.color = "red";
                msgDiv.innerText = "لطفاً تمام فیلدها را پر کنید!";
                return;
            }

            msgDiv.style.color = "gray";
            msgDiv.innerText = "در حال ارسال...";

            fetch(API_URL, {
                method: "POST",
                mode: "no-cors",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    title: title,
                    description: description,
                    status: "Active"
                })
            }).then(() => {
                msgDiv.style.color = "green";
                msgDiv.innerText = "با موفقیت در گوگل شیت ثبت شد!";
                document.getElementById('title').value = '';
                document.getElementById('description').value = '';
            }).catch(error => {
                msgDiv.style.color = "red";
                msgDiv.innerText = "خطا در ارسال اطلاعات!";
            });
        }
    </script>
</body>
</html>
